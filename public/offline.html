<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — veinsofDrop</title>
    <meta name="theme-color" content="#db2b2b" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 24px;
            text-align: center;
        }

        .drop {
            width: 80px;
            height: 80px;
            margin: 0 auto 28px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p {
            font-size: 0.95rem;
            color: #94a3b8;
            max-width: 320px;
            line-height: 1.6;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 28px;
            background: #db2b2b;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px 22px;
            border-radius: 9999px;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        .pill:hover {
            background: #c02525;
        }

        .signal {
            margin-top: 40px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 28px;
            justify-content: center;
        }

        .bar {
            width: 6px;
            border-radius: 3px;
            background: #334155;
            animation: blink 1.5s ease-in-out infinite;
        }

        .bar:nth-child(1) {
            height: 8px;
            animation-delay: 0s;
        }

        .bar:nth-child(2) {
            height: 16px;
            animation-delay: 0.2s;
        }

        .bar:nth-child(3) {
            height: 24px;
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            100% {
                background: #334155;
            }

            50% {
                background: #64748b;
            }
        }
    </style>
</head>

<body>
    <!-- Blood drop SVG -->
    <svg class="drop" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 C50 5 10 55 10 75 A40 40 0 0 0 90 75 C90 55 50 5 50 5Z" fill="#db2b2b" />
        <path d="M50 22 C50 22 25 60 25 75 A25 25 0 0 0 68 82" stroke="rgba(255,255,255,0.25)" stroke-width="5"
            fill="none" stroke-linecap="round" />
    </svg>

    <h1>You're Offline</h1>
    <p>veinsofDrop needs an internet connection to show live donor data and blood requests.</p>

    <!-- No-bars signal animation -->
    <div class="signal" title="No connection">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <button class="pill" onclick="location.reload()">
        ↺ Retry Connection
    </button>
</body>

</html>
